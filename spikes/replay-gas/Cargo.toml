[package]
name = "replay-gas"
version = "0.1.0"
edition = "2021"
description = "Spike: gas cost of a single arena tick replay + state roots inside a NEAR contract"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
tick-core = { path = "../../crates/tick-core" }
tick-merkle = { path = "../../crates/merkle" }
arena = { path = "../../games/arena" }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
near-workspaces = { version = "=0.23.0", default-features = false, features = ["install"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
anyhow = "1"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
